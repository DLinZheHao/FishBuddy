name: iOS CI

on:
  pull_request:
  push:
    branches: [ main, develop ]

permissions:
  statuses: write

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare artifacts dir
        run: |
          set -euo pipefail
          mkdir -p artifacts

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "FishBuddy.xcodeproj" \
            -scheme "FishBuddy" \
            | tee artifacts/xcodebuild-resolve.log \
            | xcpretty || true

      - name: Build (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "FishBuddy.xcodeproj" \
            -scheme "FishBuddy" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | tee artifacts/xcodebuild-build.log \
            | xcpretty

      - name: Test
        run: |
          set -euo pipefail

          xcodebuild \
            -project "FishBuddy.xcodeproj" \
            -scheme "FishBuddy" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            test \
            | tee artifacts/xcodebuild-test.log

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts
          if-no-files-found: warn

      - name: Publish status context (ruleset compatible)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            DESC="iOS CI passed"
          else
            STATE="failure"
            DESC="iOS CI failed"
          fi

          gh api \
            -X POST \
            repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f context="ci/ios" \
            -f description="$DESC" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
